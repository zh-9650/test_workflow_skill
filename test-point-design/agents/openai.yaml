interface:
  display_name: "测试点设计 / Test Point Design"
  short_description: "承接业务理解3.3，保留决定性分支并生成机制级测试点"
  default_prompt: "Use $test-point-design after business understanding is confirmed. Generate mechanism-level test points from confirmed events, states, relationships, invariants, failure facts and flows; preserve source-effective decision branches and critical flow outcomes in branch_design; verify old and branch contracts; review granularity and coverage; collect only genuine test-design decisions at the end of the human-readable document."
