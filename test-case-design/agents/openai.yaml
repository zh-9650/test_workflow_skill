interface:
  display_name: "测试用例设计 / Test Case Design"
  short_description: "从已确认测试点展开可独立执行的测试场景、数据组和断言"
  default_prompt: "Use $test-case-design after test points are confirmed. Expand each confirmed mechanism into sufficient executable scenarios and data groups, keep every covered test point tied to observable assertions, review whether combinations or long flows hide failures, then prepare the human-readable cases and review summary for confirmation."
